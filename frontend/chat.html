<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BodhSetu — Policy & Scheme Assistant</title>
  <meta name="description"
    content="Direct, source-grounded guidance on government policies, rules, notifications and welfare entitlements.">

  <style>
    :root {
      --ink: #14211c;
      --muted: #5b6862;
      --line: #dcdfd9;
      --paper: #f7f6f1;
      --accent: #1f5a45;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--paper);
      color: var(--ink);
      line-height: 1.55;
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }

    header {
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 24px;
      border-bottom: 1px solid var(--line);
      background: var(--paper);
    }

    header a {
      color: var(--ink);
      font-weight: 600;
      text-decoration: none;
      font-size: 0.95rem;
    }

    header a:hover {
      text-decoration: underline;
    }

    .title {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .account-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--ink);
      text-decoration: none;
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .account-label {
      font-size: 0.96rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--ink);
    }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 28px 24px;
    }

    .thread {
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .empty {
      color: var(--muted);
      text-align: center;
      padding: 40px 0;
    }

    .msg-user {
      align-self: flex-end;
      max-width: 85%;
    }

    .msg-user .meta {
      text-align: right;
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .msg-user .bubble {
      background: var(--accent);
      color: #fff;
      padding: 12px 16px;
      border-radius: 14px 14px 4px 14px;
      word-break: break-word;
    }

    .note {
      border: 1px dashed var(--line);
      border-radius: 10px;
      padding: 16px 18px;
      background: #fff;
    }

    .note h2 {
      font-size: 0.95rem;
      margin-bottom: 4px;
    }

    .note p {
      color: var(--muted);
      font-size: 0.9rem;
    }

    footer {
      flex-shrink: 0;
      padding: 14px 24px 18px;
      border-top: 1px solid var(--line);
      background: var(--paper);
    }

    form {
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      min-width: 0;
      height: 50px;
      padding: 0 14px;
      font: inherit;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
    }

    input:focus {
      outline: 2px solid var(--accent);
      border-color: var(--accent);
    }

    button {
      height: 50px;
      padding: 0 22px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #17473a;
    }

    .evidence {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 16px 18px;
      background: #fff;
    }

    .evidence h2 { font-size: 0.95rem; margin-bottom: 2px; }

    .evidence .sub { color: var(--muted); font-size: 0.82rem; margin-bottom: 12px; }

    .hit { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 12px; }

    .hit:first-of-type { border-top: none; padding-top: 0; margin-top: 0; }

    .hit a { color: var(--ink); font-weight: 600; text-decoration: none; font-size: 0.92rem; }

    .hit a:hover { color: var(--accent); text-decoration: underline; }

    .hit .where { color: var(--muted); font-size: 0.8rem; margin-top: 2px; }

    .hit .snip { font-size: 0.9rem; margin-top: 6px; }

    .hit mark { background: #e4ecdf; color: var(--ink); padding: 0 1px; border-radius: 2px; }

    /* The assistant's turn. Mirrors .msg-user, flipped: same bubble radius
       idiom, white ground instead of accent, so the two read as one thread. */
    .msg-bot {
      align-self: flex-start;
      max-width: 92%;
    }

    .msg-bot .meta {
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .msg-bot .bubble {
      background: #fff;
      border: 1px solid var(--line);
      color: var(--ink);
      padding: 14px 18px;
      border-radius: 14px 14px 14px 4px;
      word-break: break-word;
    }

    .msg-bot .bubble p { margin-bottom: 10px; }

    .msg-bot .bubble p:last-child { margin-bottom: 0; }

    .msg-bot .bubble ul { margin: 0 0 10px 20px; }

    .msg-bot .bubble li { margin-bottom: 6px; }

    /* An inline [S1] reference, rendered as a link to the cited clause. */
    .cite {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 600;
      line-height: 1.6;
      padding: 0 6px;
      margin: 0 1px;
      border: 1px solid var(--accent);
      border-radius: 999px;
      color: var(--accent);
      text-decoration: none;
      vertical-align: 1px;
    }

    .cite:hover { background: var(--accent); color: #fff; }

    .sources { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }

    .sources h3 { font-size: 0.8rem; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.04em; }

    .srcrow { display: flex; gap: 8px; align-items: baseline; margin-bottom: 8px; }

    .srcrow .tagnum {
      flex-shrink: 0;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 999px;
      padding: 0 6px;
    }

    .srcrow .body { font-size: 0.86rem; }

    .srcrow a { color: var(--ink); font-weight: 600; text-decoration: none; }

    .srcrow a:hover { color: var(--accent); text-decoration: underline; }

    .srcrow .where { color: var(--muted); font-size: 0.78rem; }

    .srcrow blockquote {
      margin: 4px 0 0;
      padding-left: 10px;
      border-left: 2px solid var(--line);
      color: var(--muted);
      font-size: 0.82rem;
    }

    .pill-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }

    .pill {
      font-size: 0.72rem;
      padding: 2px 9px;
      border-radius: 999px;
      border: 1px solid var(--line);
      color: var(--muted);
      background: var(--paper);
    }

    .pill.good { border-color: var(--accent); color: var(--accent); }

    .pill.warn { border-color: #8a6a1f; color: #8a6a1f; }

    .warnbox {
      margin-top: 10px;
      border: 1px solid #8a6a1f;
      border-radius: 8px;
      padding: 8px 12px;
      background: #fff;
      color: #8a6a1f;
      font-size: 0.82rem;
    }

    /* Three dots while the pipeline runs. */
    .thinking { display: inline-flex; gap: 4px; align-items: center; }

    .thinking i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted);
      display: inline-block;
      animation: blink 1.2s infinite both;
    }

    .thinking i:nth-child(2) { animation-delay: 0.2s; }

    .thinking i:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) { .thinking i { animation: none; } }

    .foot {
      max-width: 760px;
      margin: 8px auto 0;
      color: var(--muted);
      font-size: 0.8rem;
      text-align: center;
    }

    @media (max-width: 480px) {

      header,
      main,
      footer {
        padding-left: 16px;
        padding-right: 16px;
      }

      .title {
        display: none;
      }
    }
  </style>
</head>

<body>
  <header>
    <a href="user_home.html">← Home</a>
    <a href="explore.html" style="font-weight:500;color:var(--muted)">Explore Policies</a>
    <span class="title">Policy &amp; Scheme Assistant</span>
    <a class="account-pill" href="login.html" aria-label="Citizen account" title="Citizen account">
      <span class="avatar" id="avatar">C</span>
      <span class="account-label">Citizen account</span>
    </a>
  </header>

  <main id="stream">
    <div class="thread" id="thread">
      <div class="empty" id="empty">Ask a question about the policy documents in the collection.</div>

      <div class="note" id="note" hidden>
        <h2 id="noteTitle">Checking what this assistant can answer from</h2>
        <p id="noteBody">Reading the collection&hellip;</p>
      </div>
    </div>
  </main>

  <footer>
    <form id="form" novalidate>
      <input type="text" id="input" autocomplete="off" placeholder="Ask a follow-up question or search policies..."
        aria-label="Ask a follow-up question">
      <button type="submit">Send</button>
    </form>
    <p class="foot">BodhSetu simplifies public administration rules for Indian citizens.</p>
  </footer>

  <script>
    /* ------------------------------------------------------------------
     * BodhSetu Ask — the real RAG client.
     *
     * Talks to POST /api/ask, which retrieves clauses from the stored
     * documents (BM25 + dense, fused by RRF), generates an answer grounded
     * in them, and verifies every citation against the stored clause text
     * before returning it.
     *
     * Four rules this page keeps, because they are what makes the answer
     * trustworthy rather than merely fluent:
     *
     *  1. **Nothing is rendered as HTML.** The answer and every quote came
     *     out of a PDF by way of a language model. Markdown-ish structure is
     *     turned into DOM nodes here; the text itself only ever reaches the
     *     page through textContent.
     *  2. **generation_mode is shown, never hidden.** `llm` means a model
     *     wrote it; `extractive` means no model is configured and the answer
     *     is assembled verbatim from the sources. The page says which.
     *  3. **A citation links to the clause it cites.** [S1] becomes a link
     *     into document.html with the real document, version and clause ids,
     *     so a reader can check it in two clicks.
     *  4. **Failure is stated, not mimicked.** A refusal, a missing model and
     *     an unreachable backend each render as themselves. There is no
     *     fallback that invents an answer.
     * ------------------------------------------------------------------ */

    const thread = document.getElementById('thread');
    const note = document.getElementById('note');
    const empty = document.getElementById('empty');
    const stream = document.getElementById('stream');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const sendBtn = form.querySelector('button[type="submit"]');

    // Show the signed-in user's initial
    try {
      const user = JSON.parse(localStorage.getItem('bodhsetu_user') || sessionStorage.getItem('bodhsetu_user') || '{}');
      const name = user.full_name || localStorage.getItem('bodhsetu_registered_name') || '';
      if (name.trim()) document.getElementById('avatar').textContent = name.trim().charAt(0).toUpperCase();
    } catch (err) {
      console.warn('Could not read user profile', err);
    }

    const el = (tag, cls, text) => {
      const n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text !== undefined && text !== null) n.textContent = String(text);
      return n;
    };

    let busy = false;
    let askSeq = 0;
    let status = null;

    /* --------------------------------------------------------- the thread */

    function addUserMessage(text) {
      empty.style.display = 'none';
      const row = el('div', 'msg-user');
      const meta = el('div', 'meta',
        'You · ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
      const bubble = el('div', 'bubble', text);
      row.appendChild(meta);
      row.appendChild(bubble);
      thread.appendChild(row);
      scroll();
      return row;
    }

    function addBotBubble(label) {
      const row = el('div', 'msg-bot');
      const meta = el('div', 'meta', label || 'BodhSetu');
      const bubble = el('div', 'bubble');
      row.appendChild(meta);
      row.appendChild(bubble);
      thread.appendChild(row);
      scroll();
      return { row: row, meta: meta, bubble: bubble };
    }

    function thinkingDots(bubble) {
      const wrap = el('span', 'thinking');
      wrap.appendChild(el('i'));
      wrap.appendChild(el('i'));
      wrap.appendChild(el('i'));
      bubble.appendChild(el('span', null, 'Searching the documents '));
      bubble.appendChild(wrap);
    }

    function scroll() { stream.scrollTop = stream.scrollHeight; }

    function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }

    /* ------------------------------------------------------ answer render */

    function docHref(c) {
      let href = 'document.html?document_id=' + encodeURIComponent(c.document_id);
      if (c.version_id) href += '&version_id=' + encodeURIComponent(c.version_id);
      if (c.clause_id) href += '&clause_id=' + encodeURIComponent(c.clause_id);
      return href;
    }

    /**
     * Render one paragraph, turning [S1] markers into links to the clause.
     *
     * Split on the marker pattern so the surrounding prose goes in as text
     * nodes. A marker with no matching citation is rendered as plain text
     * rather than a dead link — the backend strips invented markers, so this
     * is belt and braces.
     */
    function renderWithCitations(parent, text, byMarker) {
      // Brackets: ASCII [ ], CJK lenticular 【 】 and fullwidth ［ ］. Models do not
      // reliably use the ASCII form the prompt asks for -- gpt-oss emits the
      // lenticular one -- and an ASCII-only split silently renders a citation
      // as plain text instead of a link. Same set as MARKER_PATTERN in
      // rag_module/citation/verifier.py; the two must stay in step.
      const parts = String(text).split(/([\[【［]\s*S\s*\d+(?:\s*[,;]\s*S?\s*\d+)*\s*[\]】］])/i);
      parts.forEach((part) => {
        const match = /^[\[【［]\s*(S\s*\d+(?:\s*[,;]\s*S?\s*\d+)*)\s*[\]】］]$/i.exec(part);
        if (!match) {
          if (part) appendInline(parent, part);
          return;
        }
        const markers = match[1].match(/S?\s*\d+/gi) || [];
        markers.forEach((raw) => {
          const marker = 'S' + parseInt(String(raw).replace(/\D/g, ''), 10);
          const citation = byMarker[marker];
          if (!citation) {
            parent.appendChild(document.createTextNode('[' + marker + ']'));
            return;
          }
          const link = el('a', 'cite', marker);
          link.href = docHref(citation);
          link.title = (citation.document_title || citation.document_id)
            + ' · page ' + citation.page_start
            + (citation.page_end !== citation.page_start ? '–' + citation.page_end : '');
          parent.appendChild(link);
        });
      });
    }

    /**
     * Append text, turning **bold** into <strong>. Nothing else.
     *
     * Models emit light markdown whether or not the prompt asks for it, and
     * literal asterisks around the key phrase of an answer look like a bug.
     * This handles exactly one construct, and it still never parses HTML:
     * every fragment goes in through createTextNode or an element's
     * textContent, so a '<' inside a clause stays a '<'.
     */
    function appendInline(parent, text) {
      String(text).split(/(\*\*[^*]+\*\*)/).forEach((chunk) => {
        if (!chunk) return;
        if (chunk.length > 4 && chunk.startsWith('**') && chunk.endsWith('**')) {
          parent.appendChild(el('strong', null, chunk.slice(2, -2)));
        } else {
          parent.appendChild(document.createTextNode(chunk));
        }
      });
    }

    /** Turn the answer's blank-line / bullet structure into DOM nodes. */
    function renderAnswer(bubble, answer, byMarker) {
      const blocks = String(answer || '').split(/\n{2,}/);
      blocks.forEach((block) => {
        const lines = block.split('\n').filter((l) => l.trim());
        if (!lines.length) return;
        const bulleted = lines.every((l) => /^\s*[-*•]\s+/.test(l));
        if (bulleted) {
          const ul = el('ul');
          lines.forEach((line) => {
            const li = el('li');
            renderWithCitations(li, line.replace(/^\s*[-*•]\s+/, ''), byMarker);
            ul.appendChild(li);
          });
          bubble.appendChild(ul);
        } else {
          const p = el('p');
          renderWithCitations(p, lines.join(' '), byMarker);
          bubble.appendChild(p);
        }
      });
    }

    function renderSources(bubble, citations) {
      if (!citations.length) return;
      const box = el('div', 'sources');
      box.appendChild(el('h3', null, citations.length === 1 ? 'Source' : 'Sources'));
      citations.forEach((c) => {
        const row = el('div', 'srcrow');
        row.appendChild(el('span', 'tagnum', c.marker || '—'));

        const body = el('div', 'body');
        const link = el('a', null,
          (c.clause_number ? 'Clause ' + c.clause_number + ' — ' : '')
          + (c.document_title || c.document_id));
        link.href = docHref(c);
        body.appendChild(link);

        body.appendChild(el('div', 'where',
          'page ' + c.page_start
          + (c.page_end !== c.page_start ? '–' + c.page_end : '')
          + ' · ' + c.clause_id
          + (c.verification_status === 'STRICT_VERBATIM'
            ? ' · quote verified against the stored text'
            : ' · quote matched after whitespace normalisation')));

        const quote = el('blockquote', null, c.quote + (c.quote_truncated ? '…' : ''));
        body.appendChild(quote);
        row.appendChild(body);
        box.appendChild(row);
      });
      bubble.appendChild(box);
    }

    /**
     * The clauses retrieval found, when no answer was generated.
     *
     * Deliberately headed differently from "Sources": these were not used to
     * answer anything, because nothing was answered. Calling them sources
     * would imply an answer rests on them.
     */
    function renderFoundPassages(bubble, passages) {
      const box = el('div', 'sources');
      box.appendChild(el('h3', null, 'Clauses that matched your question'));
      passages.slice(0, 4).forEach((p) => {
        const row = el('div', 'srcrow');
        row.appendChild(el('span', 'tagnum', String(p.rank)));
        const body = el('div', 'body');
        const link = el('a', null,
          (p.clause_number ? 'Clause ' + p.clause_number + ' — ' : '')
          + (p.document_title || p.document_id));
        link.href = docHref(p);
        body.appendChild(link);
        body.appendChild(el('div', 'where',
          'page ' + p.page_start
          + (p.page_end !== p.page_start ? '–' + p.page_end : '')
          + ' · ' + p.clause_id));
        body.appendChild(el('blockquote', null,
          p.text.length > 320 ? p.text.slice(0, 320) + '…' : p.text));
        row.appendChild(body);
        box.appendChild(row);
      });
      bubble.appendChild(box);
    }

    function renderMeta(bubble, data) {
      const row = el('div', 'pill-row');

      if (data.generation_mode === 'llm') {
        const model = data.generation_model ? ' · ' + data.generation_model : '';
        row.appendChild(el('span', 'pill good', 'written by a language model' + model));
      } else if (data.generation_mode === 'extractive') {
        row.appendChild(el('span', 'pill warn', 'assembled from the source text — no language model configured'));
      }

      if ((data.retrieval_components || []).length) {
        row.appendChild(el('span', 'pill',
          data.retrieval_strategy === 'hybrid'
            ? 'hybrid retrieval (keyword + meaning)'
            : 'keyword retrieval'));
      }
      if (data.citations && data.citations.length) {
        row.appendChild(el('span', 'pill good',
          data.citations.length + ' verified citation' + (data.citations.length === 1 ? '' : 's')));
      }
      if (typeof data.took_ms === 'number') {
        row.appendChild(el('span', 'pill', Math.round(data.took_ms) + ' ms'));
      }
      bubble.appendChild(row);

      (data.warnings || []).forEach((w) => {
        bubble.appendChild(el('div', 'warnbox', w));
      });
    }

    /* ----------------------------------------------------------- the call */

    async function ask(question) {
      if (busy) return;
      busy = true;
      sendBtn.disabled = true;
      input.disabled = true;
      const id = ++askSeq;

      addUserMessage(question);
      const slot = addBotBubble('BodhSetu · thinking');
      thinkingDots(slot.bubble);

      let data = null;
      let failure = null;
      try {
        const response = await fetch('/api/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question: question, top_k: 6 })
        });
        if (!response.ok) {
          const body = await response.json().catch(() => null);
          failure = (body && body.error && body.error.message)
            || ('The assistant returned HTTP ' + response.status + '.');
        } else {
          data = await response.json();
        }
      } catch (err) {
        failure = 'Could not reach the BodhSetu backend. Is the application running?';
      } finally {
        busy = false;
        sendBtn.disabled = false;
        input.disabled = false;
        input.focus();
      }

      if (id !== askSeq) return;   // a newer question is already on screen

      clear(slot.bubble);
      if (failure) {
        slot.meta.textContent = 'BodhSetu · could not answer';
        slot.bubble.appendChild(el('p', null, failure));
        scroll();
        return;
      }

      const byMarker = {};
      (data.citations || []).forEach((c) => { if (c.marker) byMarker[c.marker] = c; });

      slot.meta.textContent = data.sufficient_evidence
        ? 'BodhSetu'
        : 'BodhSetu · not answered from the documents';

      renderAnswer(slot.bubble, data.answer, byMarker);
      renderSources(slot.bubble, data.citations || []);
      // No answer was generated, but retrieval still found clauses. Showing
      // them is the useful, honest half: they are real stored text with real
      // page references, clearly labelled as "found, not answered from".
      if (!(data.citations || []).length && (data.passages || []).length) {
        renderFoundPassages(slot.bubble, data.passages);
      }
      renderMeta(slot.bubble, data);
      scroll();
    }

    /* --------------------------------------------------------- the status */

    async function loadStatus() {
      try {
        const response = await fetch('/api/ask/status');
        if (!response.ok) throw new Error('HTTP ' + response.status);
        status = await response.json();
      } catch (err) {
        note.hidden = false;
        document.getElementById('noteTitle').textContent = 'The assistant is not reachable';
        document.getElementById('noteBody').textContent =
          'The BodhSetu backend did not respond, so questions cannot be answered right now.';
        return;
      }

      const corpus = status.corpus || {};
      const gen = status.generation || {};
      const ret = status.retrieval || {};

      if (!status.ready) {
        note.hidden = false;
        document.getElementById('noteTitle').textContent = 'There are no documents to answer from';
        document.getElementById('noteBody').textContent =
          'Add an official policy PDF through Add Document, and this assistant will answer from it.';
        return;
      }

      if (gen.mode === 'extractive') {
        // Stated up front rather than discovered after waiting for an answer.
        note.hidden = false;
        document.getElementById('noteTitle').textContent = 'No language model is configured';
        document.getElementById('noteBody').textContent =
          'Answers are assembled verbatim from the clauses that match your question, '
          + 'with their sources, rather than written. Set NIYAMSETU_RAG_LLM_PROVIDER '
          + 'and NIYAMSETU_RAG_LLM_API_KEY in .env to turn on generated answers.';
      }

      const parts = [];
      if (corpus.segments) {
        parts.push(corpus.segments + ' clauses from '
          + corpus.documents + ' document' + (corpus.documents === 1 ? '' : 's'));
      }
      if (ret.dense_state === 'loading') parts.push('semantic search is still loading');
      if (parts.length) {
        empty.textContent = 'Ask a question about the policy documents in the collection — '
          + parts.join(' · ') + '.';
      }

      // The dense arm loads in the background; refresh the line once.
      if (ret.dense_state === 'loading') {
        setTimeout(loadStatus, 8000);
      }
    }

    /* --------------------------------------------------------- the wiring */

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const q = input.value.trim();
      if (!q) return;
      input.value = '';
      ask(q);
    });

    loadStatus();

    // A question passed from user_home.html (URL or session storage).
    const params = new URLSearchParams(window.location.search);
    const first = (params.get('q') || params.get('question')
      || sessionStorage.getItem('bodhsetu_pending_question') || '').trim();
    if (first) {
      sessionStorage.removeItem('bodhsetu_pending_question');
      ask(first);
    }
  </script>
</body>

</html>
